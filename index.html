<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sys Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10110e;
        --panel: #181a16;
        --ink: #edf0e6;
        --muted: #9aa192;
        --line: #2c3128;
        --cyan: #9dbe4a;
        --amber: #e0a45a;
        --pink: #e07a66;
        --danger: #ff5d5d;
        font-family: "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(157, 190, 74, 0.06), transparent 220px),
          var(--bg);
        color: var(--ink);
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: end;
        margin-bottom: 22px;
      }

      .eyebrow {
        margin: 0;
        color: var(--cyan);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 12px;
      }

      h1 {
        margin: 6px 0 0;
        font-size: clamp(32px, 5vw, 48px);
        letter-spacing: -0.04em;
      }

      #mode {
        margin: 0;
        color: var(--muted);
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 12px;
      }

      .meta, .gauges {
        display: grid;
        gap: 12px;
      }

      .meta {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 12px;
      }

      .gauges {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 12px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
      }

      .card h2, .meta h2 {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .meta p, .detail {
        margin: 8px 0 0;
        font-family: Consolas, "Cascadia Mono", monospace;
      }

      .meta p { font-size: 18px; }

      .gauge {
        display: grid;
        grid-template-columns: 116px 1fr;
        gap: 8px;
        align-items: center;
      }

      svg.ring { width: 116px; height: 116px; }

      .track { fill: none; stroke: #2a2e26; stroke-width: 10; }
      .value {
        fill: none;
        stroke: var(--cyan);
        stroke-width: 10;
        stroke-linecap: butt;
        transform: rotate(-90deg);
        transform-origin: 60px 60px;
        transition: stroke-dashoffset 0.7s ease, stroke 0.3s ease;
      }

      .readout {
        margin: 0;
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 32px;
        letter-spacing: -0.04em;
      }

      .detail { color: var(--muted); font-size: 13px; }

      .chart-card h2 { margin-bottom: 12px; }

      canvas {
        display: block;
        width: 100%;
        height: 240px;
      }

      .legend {
        display: flex;
        gap: 16px;
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .legend i {
        display: inline-block;
        width: 14px;
        height: 3px;
        margin-right: 6px;
        vertical-align: middle;
      }

      #error {
        min-height: 1.2em;
        margin: 14px 0 0;
        color: var(--danger);
        font-size: 13px;
      }

      @media (max-width: 800px) {
        .meta, .gauges { grid-template-columns: 1fr; }
        header { display: block; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Local resources</p>
          <h1>Sys Monitor</h1>
        </div>
        <p id="mode">Connecting…</p>
      </header>

      <section class="meta" aria-label="Host">
        <article class="card">
          <h2>Host</h2>
          <p id="host">—</p>
        </article>
        <article class="card">
          <h2>Uptime</h2>
          <p id="uptime">—</p>
        </article>
        <article class="card">
          <h2>Processes</h2>
          <p id="procs">—</p>
        </article>
        <article class="card">
          <h2>Load</h2>
          <p id="load">—</p>
        </article>
      </section>

      <section class="gauges" aria-label="Usage">
        <article class="card gauge">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="46"></circle>
            <circle class="value" id="cpu-ring" cx="60" cy="60" r="46"></circle>
          </svg>
          <div>
            <h2>CPU</h2>
            <p class="readout"><span id="cpu-num">0</span>%</p>
            <p class="detail" id="cpu-detail">—</p>
          </div>
        </article>
        <article class="card gauge">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="46"></circle>
            <circle class="value" id="mem-ring" cx="60" cy="60" r="46"></circle>
          </svg>
          <div>
            <h2>Memory</h2>
            <p class="readout"><span id="mem-num">0</span>%</p>
            <p class="detail" id="mem-detail">—</p>
          </div>
        </article>
        <article class="card gauge">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="46"></circle>
            <circle class="value" id="disk-ring" cx="60" cy="60" r="46"></circle>
          </svg>
          <div>
            <h2>Disk</h2>
            <p class="readout"><span id="disk-num">0</span>%</p>
            <p class="detail" id="disk-detail">—</p>
          </div>
        </article>
      </section>

      <section class="card chart-card">
        <h2>Last 60 seconds</h2>
        <canvas id="chart" width="1000" height="240"></canvas>
        <p class="legend">
          <span><i style="background:#9dbe4a"></i>CPU</span>
          <span><i style="background:#e07a66"></i>Memory</span>
          <span><i style="background:#e0a45a"></i>Disk</span>
        </p>
      </section>
      <p id="error" role="status"></p>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
